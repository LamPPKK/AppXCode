name: AppXCode CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ide/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ide/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    concurrency:
      group: appxcode-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Verify source layout
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f ide/src/main/resources/META-INF/plugin.xml
          grep -q 'dev.appxcode.ide' ide/src/main/resources/META-INF/plugin.xml
      - name: Run tests
        run: gradle test --no-daemon
      - name: Build plugin
        run: gradle buildPlugin --no-daemon
      - name: Verify plugin compatibility
        run: gradle verifyPlugin --no-daemon
